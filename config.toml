# Pop! OS Whisper dictation config
# Edita este archivo para cambiar el comportamiento por defecto.

# Modelos recomendados:
# - "small": mejor balance general
# - "medium": mejor calidad, mas lento
model = "small"

# Idioma:
# - "auto": autodeteccion
# - "es": espanol
# - "en": ingles
language = "es"

# Correccion posterior con LanguageTool.
enable_languagetool = true

# Dispositivo ALSA para grabacion.
# En esta maquina conviene usar el micro Blue Snowball.
record_device = "sysdefault:CARD=Snowball"
